<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>AGARTALA RUN 3D</title><style>*{box-sizing:border-box}body{margin:0;background:#101629;color:white;font-family:system-ui;overflow:hidden}canvas{display:block}#hud{position:fixed;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;gap:8px;pointer-events:none;font-weight:900;text-shadow:0 2px 5px #000}#hud span{padding:9px;border-radius:12px;background:#142142b9}#screen{position:fixed;inset:0;background:linear-gradient(135deg,#101a3bed,#24123fe8);display:grid;place-items:center;overflow:auto;padding:15px}#panel{width:min(450px,100%);text-align:center;border:1px solid #79d5ff66;background:#17254eea;border-radius:25px;padding:20px;box-shadow:0 15px 60px #0008}h1{font-size:clamp(36px,9vw,58px);color:#ffcf5d;line-height:.95;margin:8px;text-shadow:0 4px #df4479}p{color:#dce9ff}button,select{padding:12px;border:0;border-radius:12px;font-weight:900;font-size:15px;margin:5px}button{background:linear-gradient(110deg,#ffd55c,#ff8b5b);color:#15203b;cursor:pointer}select{background:#293d66;color:white;max-width:95%}#touch{position:fixed;bottom:12px;left:0;right:0;display:flex;justify-content:space-between;padding:0 12px;pointer-events:none}#touch button{pointer-events:auto;background:#162648bf;color:white;border:1px solid #ffffff80;font-size:23px;min-width:55px;touch-action:none}#toast{position:fixed;top:22%;width:100%;text-align:center;font-size:clamp(24px,6vw,38px);font-weight:1000;text-shadow:0 4px 10px #000;pointer-events:none}.hidden{display:none!important}small{color:#b7cbe8}</style></head><body><div id="hud" class="hidden"><span id="score">🏃 0</span><span id="coins">🪙 0</span><span id="gifts">🎁 0</span><span id="power">🛡️ 0</span></div><div id="toast"></div><div id="touch" class="hidden"><div><button data-a="left">◀</button><button data-a="right">▶</button></div><div><button data-a="slide">⬇</button><button data-a="jump">⬆</button></div></div><div id="screen"><div id="panel"><h1>AGARTALA<br>RUN 3D</h1><p>🛺 TRIPURA CITY ESCAPE 🚨</p><div id="result">Run, collect coins, open mystery gifts and escape the officer!</div><p>📍 <select id="route"><option>Ujjayanta Palace</option><option>Battala Market</option><option>Heritage Park</option><option>Durga Puja Street</option></select></p><p>🧍 <select id="runner"></select></p><button id="play">▶ PLAY 3D</button><button id="buy">🛍️ UNLOCK</button><button id="mute">🔊 SOUND</button><p id="wallet"></p><small>Swipe or use ← → to change lanes, ↑ / Space to jump, ↓ to slide. Requires internet to load the 3D engine on first visit.</small></div></div><script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.1/three.min.js"></script><script>
(()=>{'use strict';const $=s=>document.querySelector(s);let store={wallet:0,best:0,unlocked:[0]};try{Object.assign(store,JSON.parse(localStorage.getItem('agartala-run-3d')||'{}'))}catch{}const persist=()=>{try{localStorage.setItem('agartala-run-3d',JSON.stringify(store))}catch{}};const chars=[['City Runner',0,0x20d6ee],['Puja Star',120,0xf56aa7],['Delivery Hero',240,0xffcf4a],['Tripura Champ',360,0x68dc8c],['Meme King',500,0xc69cff]];let hero=0,route=0,playing=false,lane=1,jump=0,slide=0,shield=0,magnet=0,score=0,coins=0,gifts=0,speed=17,elapsed=0,spawn=0,objs=[],decor=[],audio=null,sound=true,toastTime=0;const names=['UJJAYANTA PALACE','BATTALA MARKET','HERITAGE PARK','DURGA PUJA STREET'];function refresh(){const r=$('#runner');r.innerHTML='';chars.forEach((c,i)=>{const o=document.createElement('option');o.value=i;o.textContent=c[0]+(store.unlocked.includes(i)?' ✓':' 🔒 '+c[1]+' coins');r.append(o)});r.value=hero;$('#wallet').textContent='🪙 Wallet '+store.wallet+'  |  🏆 Best '+store.best}refresh();$('#runner').onchange=e=>hero=+e.target.value;$('#route').onchange=e=>route=+e.target.selectedIndex;function beep(f=700,d=.1){if(!sound)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();audio.resume();let o=audio.createOscillator(),g=audio.createGain();o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(.055,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+d)}catch{}}function toast(t){$('#toast').textContent=t;toastTime=1.5}$('#mute').onclick=()=>{sound=!sound;$('#mute').textContent=sound?'🔊 SOUND':'🔇 MUTED'};$('#buy').onclick=()=>{if(store.unlocked.includes(hero))return toast('ALREADY UNLOCKED 😎');if(store.wallet<chars[hero][1])return toast('NEED MORE COINS 🪙');store.wallet-=chars[hero][1];store.unlocked.push(hero);persist();refresh();toast('UNLOCKED! 🎉')};
if(!window.THREE){$('#result').textContent='3D engine could not load. Check your internet connection and refresh.';$('#play').disabled=true;return}
const scene=new THREE.Scene();scene.background=new THREE.Color(0x83c9f7);scene.fog=new THREE.Fog(0x83c9f7,35,110);const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,180);camera.position.set(0,5,10);camera.lookAt(0,1,-13);const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;document.body.prepend(renderer.domElement);scene.add(new THREE.HemisphereLight(0xffffff,0x647c69,2.2));const sun=new THREE.DirectionalLight(0xffe4b2,2.5);sun.position.set(-12,23,14);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);scene.add(sun);function mat(c){return new THREE.MeshStandardMaterial({color:c,roughness:.85})}const roadMat=mat(0x454b5b),grassMat=mat(0x428a5a),white=mat(0xffe6a5);function cube(w,h,d,m,x,y,z,group=scene){const mesh=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);mesh.position.set(x,y,z);mesh.castShadow=true;mesh.receiveShadow=true;group.add(mesh);return mesh}function ball(r,m,x,y,z,g=scene){let o=new THREE.Mesh(new THREE.SphereGeometry(r,12,9),m);o.position.set(x,y,z);o.castShadow=true;g.add(o);return o}cube(300,.1,220,grassMat,0,-.12,-50);cube(10,.13,200,roadMat,0,0,-50);for(let z=8;z>-120;z-=7){for(let x of [-1.67,1.67])cube(.12,.02,3,white,x,.09,z)}const runner=new THREE.Group();scene.add(runner);let torso=cube(.82,1.1,.55,mat(chars[0][2]),0,1.35,0,runner);let head=ball(.36,mat(0xffc9a2),0,2.25,0,runner);cube(.72,.16,.67,mat(0x252139),0,2.53,0,runner);let limbs=[];for(let x of [-.26,.26]){limbs.push(cube(.26,.8,.3,mat(0x27385a),x,.43,0,runner));limbs.push(cube(.23,.85,.24,mat(0xffc9a2),x*2,1.4,0,runner))}const officer=new THREE.Group();scene.add(officer);cube(.85,1.05,.6,mat(0xc7a27c),0,1.2,0,officer);ball(.36,mat(0xf5c4a0),0,2.13,0,officer);cube(.8,.18,.7,mat(0x263c6a),0,2.47,0,officer);for(let x of [-.23,.23])cube(.28,.9,.28,mat(0x263c6a),x,.45,0,officer);officer.position.z=5.8;
function buildCity(){decor.forEach(o=>scene.remove(o));decor=[];const themes=[0xd6bd9d,0xf4a96e,0x9dcdb5,0xe5a0cb];scene.background=new THREE.Color([0x8bc9fa,0xffc397,0xa2dbd1,0x765fba][route]);scene.fog.color.copy(scene.background);for(let i=0;i<42;i++){let z=12-i*6;for(let side of [-1,1]){let g=new THREE.Group();g.position.set(side*(9+Math.random()*3),0,z);scene.add(g);decor.push(g);if(route===2||Math.random()<.23){cube(.5,3,.5,mat(0x72533b),0,1.5,0,g);ball(1.8,mat(0x278455),0,3.5,0,g)}else{let h=3+Math.random()*8;cube(4,h,4,mat(themes[route]),0,h/2,0,g);for(let k=0;k<3;k++)cube(.6,.7,.08,mat(0xffed9e),side>0?-2.03:2.03,1.5+k*1.7,0,g);if(route===3)ball(.4,mat(0xffe95d),0,h+.3,0,g)}}}if(route===0){let g=new THREE.Group();g.position.set(0,0,-91);scene.add(g);decor.push(g);cube(13,6,5,mat(0xffe4c3),0,3,0,g);cube(3,3,3,mat(0xf8e6d2),0,7.3,0,g);let roof=new THREE.Mesh(new THREE.ConeGeometry(2.4,2,4),mat(0xc76c63));roof.position.y=9.6;g.add(roof)}}buildCity();
function makeItem(type,l,z){const g=new THREE.Group();scene.add(g);g.position.set((l-1)*3.2,0,z);let gold=mat(0xffd43b);if(type==='coin'){let m=new THREE.Mesh(new THREE.TorusGeometry(.43,.16,8,16),gold);m.position.y=1.4;g.add(m)}else if(type==='gift'){cube(.9,.9,.9,mat(0xf75e9b),0,.9,0,g);cube(.16,1,.95,gold,0,.9,0,g);cube(.95,1,.16,gold,0,.9,0,g)}else if(type==='shield'){ball(.52,mat(0x5ef0ff),0,1.2,0,g)}else if(type==='magnet'){let o=new THREE.Mesh(new THREE.TorusGeometry(.42,.17,8,14,Math.PI*1.5),mat(0xed4c65));o.position.y=1.3;g.add(o)}else if(type==='barrier'){cube(2.3,.95,.6,mat(0xffa53d),0,.5,0,g);cube(2.3,.16,.68,white,0,.5,0,g)}else if(type==='high'){cube(2.6,.35,.7,mat(0xffa53d),0,2.05,0,g);for(let x of [-1.1,1.1])cube(.17,2,.17,white,x,1,0,g)}else if(type==='auto'){cube(2.1,1.45,2.6,mat(0x1f9c75),0,1,0,g);cube(1.6,.7,1.4,mat(0xffe36d),0,2,0,g);for(let x of [-1.1,1.1])for(let zz of [-.8,.8])ball(.32,mat(0x22232e),x,.35,zz,g)}else{cube(2.2,1.2,1,mat(0xff695e),0,.6,0,g)}objs.push({type,l,z,g,done:false})}
function start(){if(!store.unlocked.includes(hero))return toast('UNLOCK THIS RUNNER FIRST 🔒');playing=true;$('#screen').classList.add('hidden');$('#hud').classList.remove('hidden');$('#touch').classList.remove('hidden');torso.material=mat(chars[hero][2]);buildCity();for(let o of objs)scene.remove(o.g);objs=[];lane=1;jump=0;slide=0;shield=0;magnet=0;score=0;coins=0;gifts=0;speed=17;elapsed=0;spawn=.5;beep(880,.15);toast('POLICE UNCLE IS COMING! 🚨')}$('#play').onclick=start;function end(){playing=false;store.wallet+=coins;store.best=Math.max(store.best,Math.floor(score));persist();$('#result').innerHTML='<b>🚨 CAUGHT!</b><p>🏃 Score '+Math.floor(score)+' • 🪙 '+coins+' • 🎁 '+gifts+'</p><p>'+['O MA GO! 😂','AGARTALA TRAFFIC OP! 💀','BHAI SHORTCUT KIDHAR HAI? 🛺'][Math.floor(Math.random()*3)]+'</p>';$('#screen').classList.remove('hidden');$('#hud').classList.add('hidden');$('#touch').classList.add('hidden');refresh();beep(180,.35)}function action(a){if(!playing)return;if(a==='left')lane=Math.max(0,lane-1);if(a==='right')lane=Math.min(2,lane+1);if(a==='jump'&&jump<=0){jump=.82;beep(490)}if(a==='slide')slide=.7}addEventListener('keydown',e=>{let m={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',ArrowUp:'jump',Space:'jump',ArrowDown:'slide',KeyS:'slide'};if(m[e.code]){e.preventDefault();action(m[e.code])}});document.querySelectorAll('[data-a]').forEach(b=>b.onpointerdown=e=>{e.preventDefault();action(b.dataset.a)});let pt=null;renderer.domElement.addEventListener('pointerdown',e=>pt=[e.clientX,e.clientY]);renderer.domElement.addEventListener('pointerup',e=>{if(!pt)return;let dx=e.clientX-pt[0],dy=e.clientY-pt[1];action(Math.abs(dx)>Math.abs(dy)?dx>0?'right':'left':dy<0?'jump':'slide');pt=null});function collect(type){if(type==='coin'){coins++;score+=10;beep(1050,.06);if(coins%25===0)toast('PAISA HI PAISA! 🤑')}else if(type==='gift'){gifts++;let n=Math.random();if(n<.5){coins+=25;toast('🎁 +25 COINS!')}else if(n<.75){shield=10;toast('🎁 SHIELD POWER!')}else{magnet=10;toast('🎁 MAGNET POWER!')}beep(1100,.22)}else if(type==='shield'){shield=10;toast('🛡️ SHIELD!')}else{magnet=10;toast('🧲 MAGNET!')}}
let prev=performance.now();function animate(now){requestAnimationFrame(animate);let dt=Math.min(.04,(now-prev)/1000);prev=now;if(playing){elapsed+=dt;speed=Math.min(34,17+elapsed*.18);score+=dt*speed;spawn-=dt;if(spawn<=0){spawn=Math.max(.34,.85-speed*.012);let r=Math.random(),type=r<.44?'coin':r<.55?'gift':r<.62?'shield':r<.69?'magnet':r<.83?'barrier':r<.94?'auto':'high';makeItem(type,Math.floor(Math.random()*3),-85);if(Math.random()<.4)makeItem('coin',Math.floor(Math.random()*3),-94)}jump=Math.max(0,jump-dt);slide=Math.max(0,slide-dt);shield=Math.max(0,shield-dt);magnet=Math.max(0,magnet-dt);runner.position.x+=( (lane-1)*3.2-runner.position.x)*Math.min(1,dt*14);runner.position.y=jump>0?Math.sin((1-jump/.82)*Math.PI)*2.1:0;runner.scale.y=slide>0?.62:1;limbs.forEach((o,i)=>o.rotation.x=Math.sin(elapsed*16+(i%2)*Math.PI)*.55);officer.position.x+=(runner.position.x-officer.position.x)*dt*4;for(let o of objs){o.g.position.z+=speed*dt;if(o.type==='coin'||o.type==='gift'||o.type==='shield'||o.type==='magnet')o.g.rotation.y+=dt*2.5;const pickup=['coin','gift','shield','magnet'].includes(o.type);if(!o.done&&o.g.position.z>-.5&&o.g.position.z<1.4){if(pickup&&(o.l===lane||magnet>0)){o.done=true;collect(o.type)}else if(!pickup&&o.l===lane){o.done=true;const safe=(o.type==='barrier'&&jump>.16)||(o.type==='high'&&slide>.1);if(!safe){if(shield>0){shield=0;toast('SHIELD SAVED YOU 😎')}else{toast('O MA GO! 💀');end()}}}}}objs=objs.filter(o=>{if(o.done||o.g.position.z>15){scene.remove(o.g);return false}return true});$('#score').textContent='🏃 '+Math.floor(score);$('#coins').textContent='🪙 '+coins;$('#gifts').textContent='🎁 '+gifts;$('#power').textContent='🛡️ '+Math.ceil(shield);if(toastTime>0){toastTime-=dt;if(toastTime<=0)$('#toast').textContent=''}}camera.position.x+=(runner.position.x*.35-camera.position.x)*Math.min(1,dt*4);camera.lookAt(runner.position.x*.35,1,-14);renderer.render(scene,camera)}requestAnimationFrame(animate);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)})})();
</script></body></html>
