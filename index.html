<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#10152e"><title>Agartala Run — City Escape</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#10152e;color:white;font-family:system-ui,Arial}canvas{display:block;width:100vw;height:100dvh;touch-action:none}#hud{position:fixed;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;gap:8px;pointer-events:none;font-weight:900;text-shadow:0 2px 6px #000}#hud span{background:#10152ecc;padding:9px 12px;border:1px solid #ffffff55;border-radius:16px}#menu{position:fixed;inset:0;background:linear-gradient(160deg,#0b1234ee,#201045ee);display:flex;align-items:center;justify-content:center;padding:18px;overflow:auto}#panel{width:min(450px,100%);background:#182448ed;border:1px solid #8ddfff88;border-radius:28px;padding:22px;box-shadow:0 18px 90px #0009;text-align:center}h1{margin:0;font-size:clamp(32px,8vw,54px);line-height:1;color:#ffd65a;text-shadow:0 4px #ec4c7d}p{color:#d7e6ff}button,select{border:0;border-radius:14px;padding:12px 14px;font:800 15px system-ui;cursor:pointer}button{background:linear-gradient(110deg,#ffcf50,#ff7e59);color:#17213b;margin:5px}button:disabled{opacity:.5}select{background:#253961;color:white;max-width:100%;margin:5px}#toast{position:fixed;top:23%;left:50%;transform:translateX(-50%);font-size:clamp(23px,6vw,38px);font-weight:1000;text-shadow:0 4px 10px black;pointer-events:none;text-align:center;white-space:nowrap}#touch{position:fixed;bottom:12px;left:0;right:0;display:flex;justify-content:space-between;padding:0 18px;pointer-events:none}#touch button{pointer-events:auto;background:#111d3cbb;border:1px solid #ffffff77;color:white;font-size:22px;min-width:54px;touch-action:none}small{color:#a9c9ec}.hide{display:none!important}</style></head><body>
<canvas id="game"></canvas><div id="hud" class="hide"><span id="score">🏃 0</span><span id="coins">🪙 0</span><span id="gift">🎁 0</span><span id="shield">🛡️ —</span></div><div id="toast"></div><div id="touch" class="hide"><div><button data-act="left">◀</button><button data-act="right">▶</button></div><div><button data-act="slide">⬇</button><button data-act="jump">⬆</button></div></div>
<div id="menu"><div id="panel"><h1>AGARTALA<br>RUN!</h1><p>🏃‍♂️ CITY ESCAPE • TRIPURA EDITION</p><div id="summary">Run through the city, grab gifts, dodge autos and escape the chasing officer!</div><p><label>📍 Route <select id="route"><option value="0">Ujjayanta Palace</option><option value="1">Battala Market</option><option value="2">Heritage Park</option><option value="3">Durga Puja Street</option></select></label></p><p><label>🧍 Runner <select id="runner"></select></label></p><button id="play">▶ PLAY NOW</button><button id="buy">🛍️ UNLOCK RUNNER</button><button id="sound">🔊 SOUND ON</button><p id="wallet"></p><small>PC: ← → / A D move, ↑ / Space jump, ↓ slide. Mobile: swipe or tap buttons.<br>All rewards are virtual in-game items.</small></div></div>
<script>
(()=>{'use strict';const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d');let W=0,H=0,dpr=1;function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
const $=s=>document.querySelector(s),saveKey='agartala-run-v2',defaults={wallet:0,best:0,unlocked:[0]};let saved;try{saved=Object.assign({},defaults,JSON.parse(localStorage.getItem(saveKey)||'{}'))}catch{saved={...defaults}};if(!Array.isArray(saved.unlocked))saved.unlocked=[0];function persist(){try{localStorage.setItem(saveKey,JSON.stringify(saved))}catch{}}
const characters=[['Ani Runner','#36d6f8',0],['Puja Star','#f472b6',120],['Delivery Hero','#ffd35c',240],['Tripura Champ','#7de6a1',360],['Meme King','#c5a5ff',500]],places=['UJJAYANTA PALACE','BATTALA MARKET','HERITAGE PARK','DURGA PUJA STREET'],sky=[['#4b7fe0','#f8b37a'],['#5b66ad','#f7a76a'],['#279f96','#c2e7a1'],['#312d7b','#e976a6']];let route=0,hero=0,mode='menu',lane=1,jump=0,slide=0,elapsed=0,dist=0,score=0,coins=0,gifts=0,shield=0,magnet=0,speed=1,objects=[],spawn=0,particles=[],toastTimer=0,police=0,soundOn=true,audio=null,last=0;
function beep(freq=600,dur=.12,type='sine',vol=.07){if(!soundOn)return;try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();const o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.setValueAtTime(freq,audio.currentTime);o.frequency.exponentialRampToValueAtTime(Math.max(80,freq*.6),audio.currentTime+dur);g.gain.setValueAtTime(vol,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+dur);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+dur)}catch{}}
function toast(t){$('#toast').textContent=t;toastTimer=1.6}function fillRunner(){const sel=$('#runner');sel.innerHTML='';characters.forEach((c,i)=>{const o=document.createElement('option');o.value=i;o.textContent=c[0]+(saved.unlocked.includes(i)?' ✓':' 🔒 '+c[2]+' coins');sel.append(o)});sel.value=hero;$('#wallet').textContent='🪙 Wallet: '+saved.wallet+'  |  🏆 Best: '+saved.best}fillRunner();
$('#runner').onchange=e=>hero=+e.target.value;$('#route').onchange=e=>route=+e.target.value;$('#sound').onclick=()=>{soundOn=!soundOn;$('#sound').textContent=soundOn?'🔊 SOUND ON':'🔇 SOUND OFF';beep()};$('#buy').onclick=()=>{const cost=characters[hero][2];if(saved.unlocked.includes(hero)){toast('ALREADY UNLOCKED 😎');return}if(saved.wallet<cost){toast('NEED '+(cost-saved.wallet)+' MORE COINS 🪙');return}saved.wallet-=cost;saved.unlocked.push(hero);persist();fillRunner();beep(900,.22);toast('NEW RUNNER UNLOCKED! 🎉')};
function start(){if(!saved.unlocked.includes(hero)){toast('UNLOCK THIS RUNNER FIRST 🔒');return}mode='play';$('#menu').classList.add('hide');$('#hud').classList.remove('hide');$('#touch').classList.remove('hide');lane=1;jump=0;slide=0;elapsed=0;dist=0;score=0;coins=0;gifts=0;shield=0;magnet=0;speed=1;objects=[];particles=[];spawn=.5;police=0;beep(750,.2);toast('RUN! THE OFFICER IS COMING! 🚨')}$('#play').onclick=start;
function end(){if(mode!=='play')return;mode='menu';saved.wallet+=coins;const best=Math.floor(score);saved.best=Math.max(saved.best,best);persist();$('#summary').innerHTML='<b>🚨 CAUGHT!</b><p>🏃 Score: '+best+' | 🪙 Coins: '+coins+' | 🎁 Gifts: '+gifts+'</p><p>'+['Bhai, shortcut kidhar hai? 😂','Auto wala: meter se nahi jaunga! 🛺','Police uncle is too fast! 🚨','Agartala traffic OP! 💀'][Math.floor(Math.random()*4)]+'</p>';$('#menu').classList.remove('hide');$('#hud').classList.add('hide');$('#touch').classList.add('hide');fillRunner();beep(170,.4,'sawtooth')}
function act(a){if(mode!=='play')return;if(a==='left')lane=Math.max(0,lane-1);if(a==='right')lane=Math.min(2,lane+1);if(a==='jump'&&jump<=0){jump=.75;beep(420,.13)}if(a==='slide'){slide=.65;beep(280,.1)}}
addEventListener('keydown',e=>{const map={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',ArrowUp:'jump',Space:'jump',ArrowDown:'slide',KeyS:'slide'};if(map[e.code]){e.preventDefault();act(map[e.code])}});document.querySelectorAll('[data-act]').forEach(b=>b.onpointerdown=e=>{e.preventDefault();act(b.dataset.act)});let touch=null;canvas.addEventListener('pointerdown',e=>touch=[e.clientX,e.clientY]);canvas.addEventListener('pointerup',e=>{if(!touch)return;const dx=e.clientX-touch[0],dy=e.clientY-touch[1];if(Math.abs(dx)>Math.abs(dy)&&Math.abs(dx)>22)act(dx>0?'right':'left');else if(dy< -20)act('jump');else if(dy>20)act('slide');else act('jump');touch=null});
function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(x,y,w,h)}function circle(x,y,r,c){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=c;ctx.fill()}function text(t,x,y,size=16,color='white'){ctx.fillStyle=color;ctx.font='900 '+size+'px system-ui';ctx.textAlign='center';ctx.fillText(t,x,y)}function poly(pts,c){ctx.fillStyle=c;ctx.beginPath();pts.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.closePath();ctx.fill()}
function project(l,z){const t=1-z;return{x:W/2+(l-1)*W*(.06+.22*t),y:H*.35+Math.pow(t,1.5)*H*.58,scale:.3+1.25*t}}
function backdrop(){const grad=ctx.createLinearGradient(0,0,0,H);grad.addColorStop(0,sky[route][0]);grad.addColorStop(1,sky[route][1]);ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);circle(W*.77,H*.16,Math.min(W,H)*.065,'#ffe2a2');for(let i=0;i<13;i++){const x=i*W/11-30;const hh=H*(.11+.11*(Math.sin(i*3.8)**2));rect(x,H*.35-hh,W/10,hh,'#354d78');for(let j=0;j<3;j++)rect(x+12+j*17,H*.35-hh+20,7,12,'#ffe6a1')}if(route===0){rect(W*.34,H*.19,W*.32,H*.17,'#f7dfbd');rect(W*.46,H*.10,W*.08,H*.12,'#f6e4cd');poly([[W*.44,H*.10],[W*.5,H*.04],[W*.56,H*.10]],'#b34f64');for(let i=0;i<5;i++)rect(W*(.36+i*.058),H*.25, W*.028,H*.1,'#6b7299')}if(route===1){text('🛍️ BATTALA BAZAAR',W*.5,H*.26,Math.min(22,W*.048))}if(route===2){for(let i=0;i<7;i++){circle(i*W/6,H*.32,24,'#177c59');rect(i*W/6-3,H*.32,6,28,'#805c47')}}if(route===3){for(let i=0;i<16;i++){circle(i*W/15,H*.14+Math.sin(i*.8)*12,4,i%2?'#fff1aa':'#ff77d2')}text('✨ PUJA PANDAL ✨',W*.5,H*.28,Math.min(25,W*.05))}rect(0,H*.35,W,H*.65,'#547e63');poly([[W*.44,H*.35],[W*.56,H*.35],[W*1.05,H],[W*-.05,H]],'#38425a');poly([[W*.48,H*.35],[W*.52,H*.35],[W*.7,H],[W*.3,H]],'#4b5368');for(let i=0;i<13;i++){let z=(i/13+dist*.018)%1;let p=project(1,z);rect(W/2-3,p.y,6+z*3,5+15*(1-z),'#ffe2a0')}for(let i=0;i<10;i++){let z=(i/10+dist*.009)%1,p=project(1,z);let side=W*(.08+.5*(1-z));text(i%2?'🌴':'🛺',W/2-side,p.y,Math.max(15,35*(1-z)));text(i%2?'🏪':'🌳',W/2+side,p.y,Math.max(15,35*(1-z)))}text(places[route],W/2,H*.055,Math.min(22,W*.048),'#fff4bf')}
function drawItem(o){let p=project(o.lane,o.z),s=p.scale,sz=32*s;if(o.type==='coin'){circle(p.x,p.y-sz*.4,sz*.32,'#f7b829');circle(p.x,p.y-sz*.4,sz*.23,'#ffe76a');text('₹',p.x,p.y-sz*.23,sz*.35,'#a75c0d')}else if(o.type==='gift')text('🎁',p.x,p.y,sz*1.1);else if(o.type==='shield')text('🛡️',p.x,p.y,sz);else if(o.type==='magnet')text('🧲',p.x,p.y,sz);else if(o.type==='barrier'){rect(p.x-sz*.8,p.y-sz*.7,sz*1.6,sz*.65,'#ff944a');rect(p.x-sz*.7,p.y-sz*.5,sz*1.4,sz*.12,'#fff')}else if(o.type==='high'){rect(p.x-sz*.9,p.y-sz*1.5,sz*1.8,sz*.24,'#ffc84d');rect(p.x-sz*.8,p.y-sz*1.5,sz*.15,sz*1.4,'#f5c05b');rect(p.x+sz*.65,p.y-sz*1.5,sz*.15,sz*1.4,'#f5c05b')}else{text(o.type==='auto'?'🛺':'🚧',p.x,p.y,sz*1.5)}}
function drawHero(){const p=project(lane,0),x=p.x,y=H*.88-(jump>0?Math.sin((1-jump/.75)*Math.PI)*H*.17:0),s=Math.max(.8,Math.min(1.4,W/430));circle(x,H*.89,25*s,'#17203b88');if(slide>0){rect(x-23*s,y-20*s,46*s,22*s,characters[hero][1]);circle(x+21*s,y-23*s,11*s,'#ffcfab')}else{ctx.save();ctx.translate(x,y);const stride=Math.sin(elapsed*19)*10*s;ctx.strokeStyle='#17243d';ctx.lineWidth=8*s;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-9*s,-5*s);ctx.lineTo(-13*s+stride,21*s);ctx.moveTo(9*s,-5*s);ctx.lineTo(13*s-stride,21*s);ctx.stroke();rect(-19*s,-54*s,38*s,50*s,characters[hero][1]);rect(-16*s,-49*s,32*s,8*s,'#ffffff66');ctx.strokeStyle='#ffcfab';ctx.lineWidth=8*s;ctx.beginPath();ctx.moveTo(-17*s,-44*s);ctx.lineTo(-26*s-stride,-16*s);ctx.moveTo(17*s,-44*s);ctx.lineTo(26*s+stride,-16*s);ctx.stroke();circle(0,-69*s,16*s,'#ffd2ad');ctx.fillStyle='#202039';ctx.beginPath();ctx.arc(0,-73*s,17*s,Math.PI,Math.PI*2);ctx.fill();circle(-6*s,-69*s,2*s,'#17243d');circle(6*s,-69*s,2*s,'#17243d');ctx.restore()}if(shield>0){ctx.strokeStyle='#70eeff';ctx.lineWidth=4;ctx.beginPath();ctx.ellipse(x,y-38,43*s,70*s,0,0,Math.PI*2);ctx.stroke()}if(police>0){text('👮',x-65,y+12,37)}}
function reward(o){if(o.type==='coin'){coins++;score+=10;beep(950,.065);if(coins%25===0)toast('PAISA HI PAISA! 🤑')}else if(o.type==='gift'){gifts++;const n=Math.random();if(n<.5){coins+=25;toast('🎁 JACKPOT +25 COINS!')}else if(n<.75){shield=9;toast('🎁 SHIELD ACTIVATED!')}else{magnet=9;toast('🎁 COIN MAGNET!')}beep(1050,.3,'triangle')}else if(o.type==='shield'){shield=9;toast('🛡️ INVINCIBLE!');beep(800,.2)}else if(o.type==='magnet'){magnet=9;toast('🧲 MAGNET POWER!');beep(1100,.2)}}
function update(dt){elapsed+=dt;dist+=dt*speed*10;score+=dt*speed*8;speed=Math.min(2.35,1+elapsed/100);jump=Math.max(0,jump-dt);slide=Math.max(0,slide-dt);shield=Math.max(0,shield-dt);magnet=Math.max(0,magnet-dt);police=Math.max(0,police-dt);spawn-=dt;if(spawn<=0){spawn=Math.max(.32,.78/speed);const l=Math.floor(Math.random()*3),r=Math.random();let type=r<.43?'coin':r<.55?'gift':r<.61?'shield':r<.67?'magnet':r<.82?'barrier':r<.93?'auto':'high';objects.push({lane:l,z:1.08,type,hit:false});if(Math.random()<.38)objects.push({lane:(l+1+Math.floor(Math.random()*2))%3,z:1.15,type:'coin',hit:false})}
for(const o of objects){o.z-=dt*(.48*speed);if(!o.hit&&o.z<=.11&&o.z>=-.06){const pickup=['coin','gift','shield','magnet'].includes(o.type);if((o.lane===lane||pickup&&magnet>0)&&pickup){o.hit=true;reward(o)}else if(o.lane===lane&&!pickup){const dodge=(o.type==='barrier'&&jump>.12)||(o.type==='high'&&slide>.12);if(!dodge){o.hit=true;if(shield>0){shield=0;toast('SHIELD SAVED YOU! 😎');beep(320,.18)}else{police=1;toast(['AREY BHAI! 💀','O MA GO! 😂','BACHAAO! 🚨'][Math.floor(Math.random()*3)]);end();return}}else o.hit=true}}}objects=objects.filter(o=>o.z>-.16&&!o.hit);$('#score').textContent='🏃 '+Math.floor(score);$('#coins').textContent='🪙 '+coins;$('#gift').textContent='🎁 '+gifts;$('#shield').textContent='🛡️ '+Math.ceil(shield||0);if(toastTimer>0){toastTimer-=dt;if(toastTimer<=0)$('#toast').textContent=''}}
function frame(t){let dt=Math.min(.04,(t-last)/1000||.016);last=t;backdrop();if(mode==='play'){update(dt);objects.slice().sort((a,b)=>b.z-a.z).forEach(drawItem);drawHero()}else{const x=W*.5,y=H*.78;circle(x,y,32,'#17243d');text('🏃',x,y,70)}requestAnimationFrame(frame)}requestAnimationFrame(frame);
})();
</script></body></html>
